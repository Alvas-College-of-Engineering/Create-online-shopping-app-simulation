<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<header th:fragment="header">
    <a href="/" class="logo">ShopNova</a>
    <nav>
        <ul>
            <li><a href="/products">Products</a></li>
            <li><a href="/cart">Cart (<span th:text="${session.cart != null ? session.cart.items.size() : 0}"></span>)</a></li>
            <li th:if="${session.user != null}"><a href="/order-history">Orders</a></li>
            <li th:if="${session.user != null}">
                <a href="/logout">Logout (<span th:text="${session.user.username}"></span>)</a>
            </li>
            <li th:if="${session.user == null}"><a href="/login">Login</a></li>
            <li th:if="${session.user == null}"><a href="/register">Register</a></li>
        </ul>
    </nav>
</header>

<footer th:fragment="footer">
    <p>&copy; 2026 ShopNova. All rights reserved.</p>
</footer>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - ShopNova</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div th:replace="fragments :: header"></div>

<main>
    <form action="/login" method="post">
        <h2>Login</h2>
        
        <div th:if="${param.error}" class="alert alert-error">
            Invalid username and password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            You have been logged out.
        </div>
        <div th:if="${param.registered}" class="alert alert-success">
            Registration successful. Please login.
        </div>
        <div th:if="${param.checkout}" class="alert alert-error">
            Please login to checkout.
        </div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn">Login</button>
        <p style="margin-top: 1rem; text-align: center;">Don't have an account? <a href="/register" style="color: var(--primary-color);">Register here</a></p>
    </form>
</main>

<div th:replace="fragments :: footer"></div>
</body>
</html>

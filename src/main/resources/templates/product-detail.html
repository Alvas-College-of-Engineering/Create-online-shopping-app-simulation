<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name} + ' - ShopNova'">Product Detail</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div th:replace="fragments :: header"></div>

<main>
    <div style="display: flex; gap: 3rem; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 300px; height: 400px; background-color: transparent; display: flex; align-items: center; justify-content: center; border-radius: 8px; overflow: hidden;">
            <img th:src="${product.imageUrl}" th:alt="${product.name}" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        <div style="flex: 1; min-width: 300px; display: flex; flex-direction: column; justify-content: center;">
            <h2 th:text="${product.name}" style="font-size: 2.5rem; margin-bottom: 1rem;">Product Name</h2>
            <p style="font-size: 1.2rem; color: #aaa; margin-bottom: 2rem;" th:text="${product.description}">Product description goes here.</p>
            <div style="font-size: 2rem; font-weight: bold; color: var(--secondary-color); margin-bottom: 2rem;" th:text="|$${product.price}|">$0.00</div>
            
            <form action="/cart/add" method="post" style="box-shadow: none; padding: 0; background: transparent; margin: 0; max-width: none;">
                <input type="hidden" name="productId" th:value="${product.id}">
                <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem;">
                    <label for="quantity" style="margin: 0;">Quantity:</label>
                    <input type="number" id="quantity" name="quantity" value="1" min="1" max="10" style="width: 80px;">
                </div>
                <button type="submit" class="btn" style="width: auto; padding: 1rem 3rem; font-size: 1.1rem;">Add to Cart</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="fragments :: footer"></div>
</body>
</html>

server.port=8080

# Database Configuration (Update with your credentials if necessary)
spring.datasource.url=jdbc:mysql://localhost:3306/onlineshop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:database/schema.sql
spring.sql.init.data-locations=file:database/data.sql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.org.springframework.jdbc.core=DEBUG

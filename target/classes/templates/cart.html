<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart - ShopNova</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div th:replace="fragments :: header"></div>

<main>
    <h2>Shopping Cart</h2>
    
    <div th:if="${session.cart == null or session.cart.items.empty}" class="alert alert-error" style="text-align: center;">
        Your cart is empty. <a href="/products" style="color: var(--primary-color);">Continue shopping</a>.
    </div>
    
    <div th:if="${session.cart != null and !session.cart.items.empty}">
        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${session.cart.items}">
                    <td th:text="${item.product.name}">Product Name</td>
                    <td th:text="|$${item.product.price}|">$0.00</td>
                    <td>
                        <form action="/cart/update" method="post" style="box-shadow: none; padding: 0; background: transparent; margin: 0; display: flex; gap: 0.5rem; align-items: center;">
                            <input type="hidden" name="productId" th:value="${item.product.id}">
                            <input type="number" name="quantity" th:value="${item.quantity}" min="1" style="width: 60px; padding: 0.5rem;">
                            <button type="submit" class="btn btn-secondary" style="padding: 0.5rem; width: auto;">Update</button>
                        </form>
                    </td>
                    <td th:text="|$${item.product.price * item.quantity}|">$0.00</td>
                    <td>
                        <a th:href="@{'/cart/remove/' + ${item.product.id}}" class="btn btn-danger" style="padding: 0.5rem; text-decoration: none;">Remove</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div style="display: flex; justify-content: flex-end; align-items: center; gap: 2rem;">
            <div class="total-row">Total: <span th:text="|$${session.cart.totalAmount}|" style="color: var(--primary-color);">$0.00</span></div>
            <a href="/checkout" class="btn" style="width: auto;">Proceed to Checkout</a>
        </div>
    </div>
</main>

<div th:replace="fragments :: footer"></div>
</body>
</html>

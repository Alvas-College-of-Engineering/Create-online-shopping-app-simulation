<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products - ShopNova</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div th:replace="fragments :: header"></div>

<main>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h2>Our Products</h2>
        <form action="/products" method="get" style="box-shadow: none; padding: 0; background: transparent; margin: 0; max-width: none; display: flex; gap: 1rem;">
            <select name="category" style="padding: 0.5rem; background-color: #2c2c2c; color: var(--text-color); border: 1px solid #333; border-radius: 4px;">
                <option value="">All Categories</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${param.category != null and param.category[0] == cat.id.toString()}"></option>
            </select>
            <input type="text" name="search" placeholder="Search products..." th:value="${param.search}" style="width: 200px;">
            <button type="submit" class="btn" style="width: auto;">Filter</button>
        </form>
    </div>

    <div th:each="entry : ${groupedProducts}" style="margin-bottom: 4rem;">
        <h3 th:text="${entry.key}" style="font-size: 2rem; margin-bottom: 1.5rem; color: var(--primary-color); border-bottom: 2px solid #333; padding-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px;">Category Name</h3>
        <div class="product-grid">
            <div class="product-card" th:each="product : ${entry.value}">
                <div class="product-img" style="padding: 0; background-color: transparent;">
                    <img th:src="${product.imageUrl}" th:alt="${product.name}" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="product-info">
                    <a th:href="@{'/products/' + ${product.id}}" style="text-decoration: none; color: inherit;">
                        <h3 class="product-title" th:text="${product.name}">Product Name</h3>
                    </a>
                    <div class="product-price" th:text="|$${product.price}|">$0.00</div>
                    <form action="/cart/add" method="post" style="box-shadow: none; padding: 0; background: transparent; margin: 0; width: 100%;">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <button type="submit" class="btn">Add to Cart</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <div th:if="${groupedProducts.empty}" class="alert alert-error" style="text-align: center;">
        No products found matching your criteria.
    </div>
</main>

<div th:replace="fragments :: footer"></div>
</body>
</html>
